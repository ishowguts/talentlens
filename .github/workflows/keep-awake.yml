name: keep-awake

# The free hosting tiers sleep the API after 15 idle minutes and pause the database
# after 7 idle days. A daytime ping that waits for real JSON keeps both up.
# Hours are UTC: 04:00-13:59 UTC is 09:30-19:29 IST, which stays inside the
# free 750 instance-hours a month shared by both APIs.
on:
  schedule:
    - cron: '*/5 4-13 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and wait for a JSON reply
        run: |
          # While asleep the host streams an HTML waiting page; only JSON means the API answered.
          for attempt in $(seq 1 12); do
            body=$(curl -s -m 60 "https://talentlens-api-k0rp.onrender.com/api/health" || true)
            case "$body" in
              \{*|\[*) echo "awake: ${body:0:120}"; exit 0 ;;
            esac
            echo "attempt $attempt: not ready"
            sleep 10
          done
          echo "the API did not answer with JSON"
          exit 1

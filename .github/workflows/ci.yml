name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talentlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talentlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/talentlens_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/talentlens_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The embedding model is ~90 MB and is downloaded on first use; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-${{ runner.os }}-all-MiniLM-L6-v2

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter db migrate --test

      - run: pnpm test
